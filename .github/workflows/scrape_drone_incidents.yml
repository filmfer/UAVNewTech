name: Daily Drone Incident Scraper

on:
  schedule:
    - cron: '0 8 * * 1'  # Runs daily at 8 AM Azores (UTC-1)
  workflow_dispatch:

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper script
        env:
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_SITE_ID: ${{ secrets.GOOGLE_CSE_SITE_ID }}
        run: python scraper.py

      - name: Upload results as artifact (if needed)
        uses: actions/upload-artifact@v4
        with:
          name: daily_drone_incidents
          path: top_drone_incidents.txt
