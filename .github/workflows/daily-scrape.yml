name: Daily Drone Scrape

on:
  schedule:
    # 8 AM Azores (UTC-1) is 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual run for testing

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Critical: Allows the script to commit changes back to repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Scraper
        env:
          # These pull the secrets you saved in GitHub Settings
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CUSTOM_SEARCH_ENGINE_ID: ${{ secrets.CUSTOM_SEARCH_ENGINE_ID }}
        run: python scraper.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add top_drone_remote_sensing_links.txt scraper.log
          # Only commit if there are changes
          git commit -m "Update drone search results [skip ci]" || exit 0
          git push
