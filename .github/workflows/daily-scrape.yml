name: Daily Drone Incident Scraper

on:
  schedule:
    - cron: '0 8 * * 1'  # Runs daily at 8 AM Azores timezone (UTC-1)
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Updated to v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper script
        id: scrape
        run: |
          python scraper.py
          echo "::set-output name=needs_commit::$?"
        env:
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}

      - name: Commit changes if needed
        if: steps.scrape.outputs.needs_commit == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Daily drone incident update [skip ci]"
          git push

      # Use v4+ for artifact upload (if needed)
      - name: Upload results as artifact
        uses: actions/upload-artifact@v3  # Still works, but prefer v4+
        with:
          name: daily_drone_incidents
          path: top_drone_incidents.txt
